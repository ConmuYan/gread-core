name: Smoke Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: ruff check .

    - name: Type check with mypy
      run: mypy src

    - name: Unit tests
      run: pytest tests/unit -v

    - name: Paper alignment tests
      run: pytest tests/paper_alignment -v

    - name: No-leakage check
      run: python scripts/check_no_leakage.py

    - name: No-LLM-inference check
      run: python scripts/check_no_llm_inference.py

    - name: Smoke training pipeline
      run: bash scripts/run_smoke.sh
