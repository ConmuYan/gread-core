[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gread-core"
version = "0.1.0"
description = "Contract-Verified Score-Blind Evidence Distillation for LLM-Free Graph Fraud Reasoning"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
ml = [
    "torch>=2.0",
    "torch-geometric>=2.4",
    "tensorboard>=2.14",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "torch_geometric.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "torch.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jinja2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openai"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "torch.utils.tensorboard.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "dgl.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "torch_scatter.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "gread_core.evaluation.*"
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = "gread_core.cli.*"
disable_error_code = ["type-arg", "unused-ignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "paper_alignment: Tests enforcing paper-design invariants",
]
